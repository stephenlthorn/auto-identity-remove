# docker-compose.yml - auto-identity-remove
#
# Runs the prebuilt image from GitHub Container Registry. Every release publishes
# ghcr.io/stephenlthorn/auto-identity-remove for linux/amd64 and linux/arm64, so
# nothing is built on your machine (a NAS no longer builds 940 MB of Playwright).
#
# One-off run:        docker compose run --rm watcher
# Preview only:       docker compose run --rm watcher node watcher.js --dry-run
#
# Which image. The latest release by default. Pin a release with AIDR_VERSION,
# for example `AIDR_VERSION=2.0.1 docker compose run --rm watcher`, or export it.
# The first run pulls the image and later runs use the copy already on the host, so
# a run never updates it behind your back. To update:
#
#   docker compose pull
#
# Building from source instead of pulling (needs this whole directory, and a
# machine that can take the build). docker-compose.build.yml only adds `build: .`
# to the service below, and the build is tagged with the same image name, so after
# it plain `docker compose run --rm watcher` uses your build until a
# `docker compose pull` replaces it:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build
#
# Why a second file and not `build: .` in this one: with both `image:` and `build:`
# on a service, Compose treats a failed pull (the package is private, the host is
# offline) as a warning and then BUILDS from source, silently starting the build
# that the prebuilt image exists to avoid. Without a `build:` here, a failed pull
# is an error that says so.
#
# First-time setup, once, from this directory:
#
#   mkdir -p aidr-home
#   cp config.json aidr-home/config.json       # made on a laptop with `node setup.js`
#   chmod 700 aidr-home && chmod 600 aidr-home/config.json
#   sudo chown -R 1001:1001 aidr-home          # the image user is uid 1001
#
# Upgrading from the first recipe, which mounted config.json and state.json as two
# single files at /app? Those mounts are ignored now (AIDR_HOME points at the directory
# below). Copy BOTH files into ./aidr-home; the run tells you where it looked, and
# copying only the config leaves the history behind and re-submits every broker.
#
# ./aidr-home is the ONE place this container keeps anything, via AIDR_HOME: config,
# state and its .bak, the .lock and resume .checkpoint, run logs, audit reports,
# snapshots, complaints, the confirmation inbox, and the SERP / exposure / breach /
# registry caches under aidr-home/data. The app creates its subdirectories itself.
# Back it up and treat it like config.json - it is full of PII.
#
# For a scheduled monthly run, use cron/systemd on the host to invoke
# `docker compose run --rm watcher`. On a Synology, DSM Task Scheduler runs a plain
# `docker run` with no compose file at all; docs/SYNOLOGY.md has the worked example.

services:
  watcher:
    image: ghcr.io/stephenlthorn/auto-identity-remove:${AIDR_VERSION:-latest}
    # node runs as PID 1 without this, so `docker stop` cannot reap the Chromium
    # children and the state lock is left behind - wedging the next run.
    init: true
    # The files in ./aidr-home are 0600. The image user is uid 1001, so they must
    # be owned by 1001 (the chown above) - or run as whoever owns them instead:
    #   AIDR_UID=$(id -u) AIDR_GID=$(id -g) docker compose run --rm watcher
    # (on a Synology: AIDR_UID=1026 AIDR_GID=100 or whatever `id` prints for you).
    user: "${AIDR_UID:-1001}:${AIDR_GID:-1001}"
    volumes:
      # A directory, never single files: rename() onto a single-file mount fails
      # with EBUSY, and then the lock, .bak and checkpoint would live in the
      # container layer. Never mount over /app/data: it holds the shipped broker
      # datasets (the app keeps its own writable data under AIDR_HOME/data).
      # Not :ro - state, the checkpoint, logs and --encrypt-config all write here.
      - ./aidr-home:/home/aidr
    environment:
      - NODE_ENV=production
      # Everything above lives under this one directory. (AIDR_CONFIG_PATH,
      # AIDR_CONFIG_ENC_PATH, AIDR_STATE_PATH, AIDR_LOG_DIR and AIDR_DATA_DIR still
      # work and win over it, if you ever need one file somewhere else.)
      - AIDR_HOME=/home/aidr
      # Encrypted config on a schedule: put the passphrase on the first line of a
      # 0600 file inside ./aidr-home and uncomment this. See the README. For a
      # one-off, `docker compose run --rm -e AIDR_PASSPHRASE watcher ...` works.
      # - AIDR_PASSPHRASE_FILE=/home/aidr/aidr.passphrase
      # A uid with no passwd entry has no writable home, and Chromium wants one
      # for its profile. /tmp is thrown away with the container, which is what
      # you want: broker-site cookies should not outlive a run.
      - HOME=/tmp
      # Container clocks are UTC. The scheduler and the report timestamps use
      # local time, so set this to your zone or a "1st of the month, 9am" run
      # lands at the wrong hour.
      - TZ=${TZ:-UTC}
      # Set to 1 on hosts with ~2GB RAM. See docs/SYNOLOGY.md.
      - AIDR_LOW_MEMORY=${AIDR_LOW_MEMORY:-0}
    # Docker defaults /dev/shm to 64MB; Chromium renderers exhaust that and die.
    # The code also passes --disable-dev-shm-usage so a plain `docker run`
    # without this setting still works, but a real shm is faster.
    shm_size: 512mb
